<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1010" viewBox="0 0 1680 1010" role="img" aria-labelledby="title desc">
<title id="title">Farside access, certificate and dialog layout proposal</title><desc id="desc">Illustrative access-policy and host certificate pages, plus separate examples of a remote-login editor and restart confirmation. Dialog examples represent different flows and are never shown together. No real secrets or host state are depicted.</desc>
<style>text{font-family:"Noto Sans",sans-serif;fill:#232629;font-size:15px}.title{font-size:22px;font-weight:600}.section{font-size:17px;font-weight:600}.hint{font-size:13px;fill:#535a60}</style>
<rect width="1680" height="1010" fill="#e6e9eb"/>
<text x="28" y="39" class="title" text-anchor="start">Farside access, certificates and dialogs — proposed organization</text>
<text x="28" y="66" class="hint" text-anchor="start">Layout sketches only • example accounts / paths • no saved password or private key contents</text>
<text x="28" y="94" class="hint" text-anchor="start">Short dialogs stage local edits or confirm disruption; certificate editing is a full page.</text>
<rect x="25" y="118" width="510" height="824" rx="3" fill="#eff0f1" stroke="#bbc1c5"/>

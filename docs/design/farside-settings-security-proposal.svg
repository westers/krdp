<text x="49" y="237" class="hint" text-anchor="start">Save policy changes, then restart each affected service.</text>
<text x="49" y="278" class="section" text-anchor="start">Console</text>
<text x="49" y="303" class="hint" text-anchor="start">Connect to the appropriate logged-in desktop owner.</text>

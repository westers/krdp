<title id="title">Farside server settings layout proposal</title><desc id="desc">Three illustrative pages: an overview with Console and Virtual service controls, Console settings with a scoped save, and account preferences with conditional display options. These are wireframes, not native Qt screenshots. All values are examples.</desc>

<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private desktop bus. Do not include the host's session-local.conf or
     enable systemd activation. This is process/session separation, not a
     security sandbox against applications running as the same Unix user. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
    <!-- Plasma calls this even in classic boot. Never provide a user-manager
         endpoint on this bus; those calls must fail, not reach seat0. -->
    <deny own="org.freedesktop.systemd1"/>
    <deny send_destination="org.freedesktop.systemd1"/>
  </policy>
</busconfig>

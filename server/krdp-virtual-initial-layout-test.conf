# Experimental Sol/Buzz selected-screen acceptance only. Copy this draft to
# /etc/systemd/system/krdp-virtual-host.service.d/ only in a deliberate,
# stopped-service test envelope. Do not enable it on Hal or a shared host.
[Service]
ExecStart=
ExecStart=/usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME=/var/lib/krdp/virtual-host /opt/krdp-virtual-service-test/bin/krdp-virtual-host --certificate ${KRDP_VIRTUAL_CERTIFICATE} --certificate-key ${KRDP_VIRTUAL_CERTIFICATE_KEY} --address ${KRDP_VIRTUAL_ADDRESS} --port ${KRDP_VIRTUAL_PORT} --experimental-initial-layout
